openapi: 3.0.3

# The Atlas <-> Boat contract. This document is the source of truth: the typed Go
# server (internal/wire) is generated from it and checked in (`make generate`).
# Nothing in Boat is reachable except through an operation described here —
# the CLI and the systemd units are clients of this same surface, never
# alternate paths with powers the API lacks (spec/33-boat.md §2.1).
#
# WO-0 scope: start, stop, observe. Adoption, export, watch, bootstrap and
# self-update arrive in WO-1/WO-1b/WO-5b and extend this document in place.

info:
  title: Boat
  description: |
    The per-host daemon that owns VM lifecycle mechanics and is authoritative
    for its host's observed state. Atlas holds desired state; Boat holds fact.

    Boat knows a VM only as a UUID plus resource numbers. It never learns who
    owns a VM or what runs inside it.
  version: 0.1.0

servers:
  - url: http://boat/v1
    description: |
      Reachable only over the Central-managed mgmt tunnel or the local unix
      socket at /run/boat/boat.sock. Boat never binds a public interface.

security:
  - bearerToken: []

paths:
  /health:
    get:
      summary: Liveness probe
      description: |
        Unauthenticated, so a supervisor can probe a Boat that has not yet been
        handed a token. Reports nothing an unauthenticated caller should not see.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Boat is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /host:
    get:
      summary: Host facts and the running Boat version
      description: |
        The observed facts of this host. `boat_version` is what makes desired-vs-
        observed version drift ordinary observed state rather than a separate
        bookkeeping channel (spec/33-boat.md §2.5).
      operationId: getHost
      responses:
        "200":
          description: Host facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vms:
    get:
      summary: List every VM this host observes
      operationId: listVirtualMachines
      responses:
        "200":
          description: The observed set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirtualMachine"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vms/{uuid}:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    get:
      summary: Observed state of one VM
      operationId: getVirtualMachine
      responses:
        "200":
          description: The observed VM document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMachine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Assert this VM's desired state
      description: |
        The durable primitive. Atlas states what it wants; Boat diffs against
        its store and runs forward to converge. This is how intent is
        re-asserted after a partition, so it is idempotent by construction —
        a PUT that matches the stored desired state changes nothing.

        It also carries the fence epoch, which is the only channel by which a
        Boat learns it may boot a UUID at all. Atlas is the sole issuer.
      operationId: putVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredVirtualMachine"
      responses:
        "200":
          description: The desired state as stored, after the diff was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredVirtualMachine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            Either the caller's If-Match did not name Boat's current observed
            epoch, or the epoch offered is older than the one already fenced.
            An epoch never goes backwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /export:
    get:
      summary: This host's entire observed state, in one document
      description: |
        Boat re-asserting fact, the mirror image of Atlas re-asserting intent
        with PUT. Those two calls run back to back fully resynchronize a host
        from any state, which is why this supersedes a periodic polling sweep.

        It is a consistent snapshot: materialized inside one short read
        transaction and released before it is written out, never held under
        the write lock, so a busy host is never mistaken for a partitioned one.

        The observed epoch it carries is what a later CAS write is matched
        against, so a caller can act on exactly the snapshot it read.
      operationId: getExport
      responses:
        "200":
          description: The whole-host document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /watch:
    get:
      summary: Stream observed changes as they happen
      description: |
        Server-sent events, for latency rather than truth: a dropped stream
        costs freshness, and the export restores it. Each event carries the
        observed epoch it was emitted at, so a client that reconnects knows
        whether it missed anything.
      operationId: watch
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vms/{uuid}/start:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Start a provisioned VM
      description: |
        Idempotent: starting a running VM is a no-op, and re-posting a completed
        `op_id` returns the first result without re-running (§2.7).

        A VM that stopped with a complete memory snapshot resumes from it; the
        host decides that from the on-disk marker, not from the request.
      operationId: startVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/stop:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Stop a running VM
      description: |
        Cooperative by default: the guest is asked to power itself off through
        the Firecracker API so its kernel syncs filesystems before the unit is
        stopped. Networking teardown is fired by the unit's ExecStopPost either
        way.
      operationId: stopVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /ops/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        description: The Atlas Task name this operation was created under.
        schema:
          type: string
    get:
      summary: One operation's journal record
      description: |
        Crash-recovery truth. Atlas's operator-facing audit record is still the
        Task row; the two share this identifier (§2.7).
      operationId: getOperation
      responses:
        "200":
          description: The operation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A short-lived per-host token minted by Atlas. Requests arriving over
        /run/boat/boat.sock are authenticated by unix peer credentials instead — the
        socket is 0660 and group-owned by the boat service user.

  parameters:
    VirtualMachineUuid:
      name: uuid
      in: path
      required: true
      description: The VM's UUID — the same name the Atlas Virtual Machine row carries.
      schema:
        type: string

  responses:
    OperationAccepted:
      description: |
        The operation record. Returned for a fresh run, for a still-running
        operation, and for a replay of a completed `op_id` alike.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such VM or operation on this host
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OperationIdentifierConflict:
      description: |
        The `op_id` is already recorded against a different verb or VM. Replay is
        only replay when it is the same operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, boat_version]
      properties:
        status:
          type: string
          enum: [ok]
        boat_version:
          type: string
          description: The version of the running binary — every unit on this host is this build.

    Host:
      type: object
      required: [hostname, boat_version, started_at, virtual_machine_count]
      properties:
        hostname:
          type: string
        boat_version:
          type: string
        started_at:
          type: string
          format: date-time
          description: When this daemon process started. A restart is visible here.
        virtual_machine_count:
          type: integer
          description: How many VMs this host currently observes.

    VirtualMachineStatus:
      type: string
      description: |
        Boat's observed status, derived from the host — the unit's state and the
        on-disk markers — never from a command's success.
      enum: [Running, Stopped, Sleeping, Unknown]

    VirtualMachine:
      type: object
      required: [uuid, observed_status, observed_at]
      properties:
        uuid:
          type: string
        observed_status:
          $ref: "#/components/schemas/VirtualMachineStatus"
        observed_at:
          type: string
          format: date-time
        unit_active_state:
          type: string
          description: The systemd ActiveState of firecracker-vm@<uuid>.service, verbatim.
        unit_sub_state:
          type: string
          description: The systemd SubState of the unit, verbatim.
        has_memory_snapshot:
          type: boolean
          description: A complete memory snapshot is staged, so the next start resumes from RAM.
        sleeping:
          type: boolean
          description: The sleeping marker is present — the VM is parked, not stopped.
        boot_epoch:
          type: integer
          description: |
            The fence epoch this host is permitted to boot the VM at. Absent
            means Boat holds no fence for it and will refuse to start it.
        firecracker_pid:
          type: integer
          description: |
            The running Firecracker process, when Boat has re-attached to one.
            Absent means no live process was found, not that the VM is dead.
        quarantined:
          type: boolean
          description: |
            The host holds artifacts for this VM that Boat could not read as a
            coherent state — a crash part-way through a terminate, say. It is
            reported, never silently ingested as truth, and never acted upon
            until a human or Atlas resolves it.
        quarantine_reason:
          type: string
          description: What was incoherent, in one sentence.
        observed_vcpus:
          type: integer
        observed_memory_megabytes:
          type: integer
        observed_disk_gigabytes:
          type: integer
        observed_data_disk_gigabytes:
          type: integer

    DesiredPower:
      type: string
      description: |
        The only power input Boat's reconciler takes. An explicit Stopped
        outranks a wake trap: a VM that was told to stop is not woken by
        traffic.
      enum: [Running, Stopped]

    DesiredVirtualMachine:
      type: object
      required: [uuid, boot_epoch, desired_power]
      properties:
        uuid:
          type: string
        boot_epoch:
          type: integer
          description: |
            Monotonic per-VM fence, issued only by Atlas and bumped at exactly
            one point: a migration's repoint. Boat refuses to boot a UUID whose
            local epoch is older than the one on disk, which is what stops two
            live copies of one VM after a partition.
        desired_power:
          $ref: "#/components/schemas/DesiredPower"
        vcpus:
          type: integer
        cpu_max_cores:
          type: integer
        cpu_mode:
          type: string
        memory_megabytes:
          type: integer
        disk_gigabytes:
          type: integer
        data_disk_gigabytes:
          type: integer
        sleep_on_idle:
          type: boolean
          description: |
            Enrolment, not policy. Boat runs the sleep reflex; whether a VM is
            enrolled in it is Atlas's decision and arrives here.
        idle_timeout_seconds:
          type: integer
        ipv6_address:
          type: string
        private_address:
          type: string
        mac_address:
          type: string
        tap_device:
          type: string

    UnitLiveness:
      type: object
      required: [name, active_state, sub_state]
      properties:
        name:
          type: string
        active_state:
          type: string
        sub_state:
          type: string

    LogicalVolume:
      type: object
      required: [name]
      properties:
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
        pool:
          type: string
        origin:
          type: string
          description: Set when this volume is a snapshot or a clone of another.

    HostFacts:
      type: object
      required: [hostname, boat_version]
      properties:
        hostname:
          type: string
        boat_version:
          type: string
        kernel_version:
          type: string
        firecracker_version:
          type: string
        vcpus_total:
          type: integer
        memory_megabytes_total:
          type: integer
        memory_megabytes_free:
          type: integer
        pool_disk_gigabytes_total:
          type: integer
        pool_used_percent:
          type: number
        host_signature:
          type: string
          description: |
            Identifies the CPU, kernel and Firecracker a memory snapshot was
            captured on. A snapshot only restores on a matching host.

    Export:
      type: object
      required: [observed_epoch, taken_at, host, virtual_machines]
      properties:
        observed_epoch:
          type: integer
          format: int64
          description: |
            Monotonic, bumped on every observed change. A CAS write is matched
            against this, so a caller acts on exactly the snapshot it read.
        taken_at:
          type: string
          format: date-time
        host:
          $ref: "#/components/schemas/HostFacts"
        virtual_machines:
          type: array
          items:
            $ref: "#/components/schemas/VirtualMachine"
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitLiveness"
          description: The sibling units this Boat supervises, and whether they are up.
        logical_volumes:
          type: array
          items:
            $ref: "#/components/schemas/LogicalVolume"
        fence_epochs:
          type: object
          additionalProperties:
            type: integer
          description: Every fence this host holds, by UUID.

    OperationStatus:
      type: string
      enum: [Running, Success, Failure]

    Operation:
      type: object
      required: [operation_id, verb, uuid, status, started_at]
      properties:
        operation_id:
          type: string
          description: Equal to the Atlas Task name that drove this operation.
        verb:
          type: string
          description: The verb that ran, in the host CLI's grammar (start-vm, stop-vm).
        uuid:
          type: string
        status:
          $ref: "#/components/schemas/OperationStatus"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        exit_code:
          type: integer
          description: |
            0 on success. Mirrors the exit code the equivalent Task carried.

            Absent means the operation has not finished — an operation still
            Running has no exit code, and reporting 0 for one would tell a
            client it succeeded. Any terminal operation carries this field.
        output:
          type: string
          description: |
            The operation's combined trace and output — the same text a Task row's
            stdout carries today, so the operator surface is unchanged.
        error:
          type: string
          description: Set when status is Failure. The failure, stated once.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in one sentence, at the boundary where it was detected.

    StartRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
          description: The Atlas Task name. Re-posting one returns its recorded result.

    StopRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
        graceful:
          type: boolean
          default: true
          description: |
            Ask the guest to power itself off first, so anything dirty in its page
            cache is written. False discards guest RAM — for callers that capture
            the disk another way, such as a migration cold stop.
        stop_timeout_seconds:
          type: integer
          default: 0
          description: |
            Bound the graceful drain without skipping the unit's ExecStopPost.
            0 leaves systemd's default drain in place.
