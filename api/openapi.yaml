openapi: 3.0.3

# The Atlas <-> Boat contract. This document is the source of truth: the typed Go
# server (internal/wire) is generated from it and checked in (`make generate`).
# Nothing in Boat is reachable except through an operation described here —
# the CLI and the systemd units are clients of this same surface, never
# alternate paths with powers the API lacks (spec/33-boat.md §2.1).
#
# WO-0 scope: start, stop, observe. Adoption, export, watch, bootstrap and
# self-update arrive in WO-1/WO-1b/WO-5b and extend this document in place.

info:
  title: Boat
  description: |
    The per-host daemon that owns VM lifecycle mechanics and is authoritative
    for its host's observed state. Atlas holds desired state; Boat holds fact.

    Boat knows a VM only as a UUID plus resource numbers. It never learns who
    owns a VM or what runs inside it.
  version: 0.1.0

servers:
  - url: http://boat/v1
    description: |
      Reachable only over the Central-managed mgmt tunnel or the local unix
      socket at /run/boat/boat.sock. Boat never binds a public interface.

security:
  - bearerToken: []

paths:
  /health:
    get:
      summary: Liveness probe
      description: |
        Unauthenticated, so a supervisor can probe a Boat that has not yet been
        handed a token. Reports nothing an unauthenticated caller should not see.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Boat is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /host:
    get:
      summary: Host facts and the running Boat version
      description: |
        The observed facts of this host. `boat_version` is what makes desired-vs-
        observed version drift ordinary observed state rather than a separate
        bookkeeping channel (spec/33-boat.md §2.5).
      operationId: getHost
      responses:
        "200":
          description: Host facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /units/{name}:
    parameters:
      - $ref: "#/components/parameters/UnitName"
    get:
      summary: One supervised unit's liveness
      description: |
        The sibling units are the host's own services — the thin pool, the
        network control plane, the wake trap, the management firewall. This
        reports what systemd says about one of them, verbatim.

        The name must be one this Boat supervises, and the supervised set is a
        closed list of literal names compiled into the binary. A name outside it
        is a 404 rather than a read, which is what keeps `sshd.service`,
        `boat.service` and every `firecracker-vm@<uuid>.service` unreachable
        from here. The per-VM units are not an oversight: they have their own
        verbs, their own fence and their own journal, and a second way to reach
        them would be a way around all three.
      operationId: getUnit
      responses:
        "200":
          description: The unit's liveness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitLiveness"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            This host supervises no unit by that name, or it supervises it and
            systemd reports the unit is not installed here. The two are
            different facts and the sentence says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Start or restart a supervised unit
      description: |
        The verb set is `start` and `restart`, and it deliberately does not
        include `stop`.

        Supervision here means keeping the host's own services up: "be running"
        and "be running afresh" are the only states a control plane ever wants
        this host's pool, network daemon, wake trap or firewall in, and
        `restart` already covers every legitimate use of a stop-then-start —
        including the config re-apply the mesh unit's own ExecStop exists for.
        A stop is the verb with teeth and no driver behind it: stopping the wake
        trap strands every sleeping VM on the host with nothing left watching
        its counter, and nothing in the reconciler would ever notice, because
        the reconciler reconciles VMs and not units. An operator who genuinely
        must take one down has SSH break-glass, which the split keeps
        deliberately (§12).

        It carries no `op_id`, unlike every VM verb. A verb needs one when a
        retry could run it twice into two guests, two addresses or two volumes;
        this one is idempotent by outcome — both actions converge the unit to
        "running, now", and re-posting converges it again. What bounds a retry
        storm is the unit's own `StartLimitBurst`, which systemd enforces and
        which Boat is deliberately not granted the `reset-failed` to clear: a
        rate limit that the thing being rate-limited can reset is not one.

        The reply is the unit's liveness read back AFTER the action, so a caller
        learns what the unit became rather than that a command was accepted.
      operationId: actOnUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitActionRequest"
      responses:
        "200":
          description: The unit's liveness after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitLiveness"
        "400":
          description: The action is not one this host performs on a unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            This host supervises no unit by that name, or it supervises it and
            systemd reports the unit is not installed here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vms:
    get:
      summary: List every VM this host observes
      operationId: listVirtualMachines
      responses:
        "200":
          description: The observed set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirtualMachine"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vms/{uuid}:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    get:
      summary: Observed state of one VM
      operationId: getVirtualMachine
      responses:
        "200":
          description: The observed VM document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMachine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Assert this VM's desired state
      description: |
        The durable primitive. Atlas states what it wants; Boat diffs against
        its store and runs forward to converge. This is how intent is
        re-asserted after a partition, so it is idempotent by construction —
        a PUT that matches the stored desired state changes nothing.

        It also carries the fence epoch, which is the only channel by which a
        Boat learns it may boot a UUID at all. Atlas is the sole issuer.

        A caller that DECIDED something from the mirror, rather than merely
        re-asserting what it already knew, sends `If-Match` and is refused if
        this host's observation of the VM moved since the snapshot that decision
        was taken from (§11.2).
      operationId: putVirtualMachine
      parameters:
        - $ref: "#/components/parameters/ObservedEpochPrecondition"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredVirtualMachine"
      responses:
        "200":
          description: The desired state as stored, after the diff was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredVirtualMachine"
        "400":
          description: |
            The document names a different VM than the path, states a
            `desired_power` that is not one of the two, or carries an `If-Match`
            that is not an observed epoch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            Two refusals share this code and a caller must act on them
            differently, so `reason` tells them apart rather than leaving it to
            parse a sentence.

            `fence-regression`: the epoch offered is older than the one this
            host already holds. An epoch never goes backwards, because a fence
            that can regress re-opens the window it exists to close. Retrying
            this is wrong — the caller is asserting a claim this host has
            already seen superseded.

            `stale-observation`: an `If-Match` was offered and this host's
            observation of the VM has been written since. Retrying this is
            right, after re-reading `GET /export` and re-taking the decision
            against what the host is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Retract this VM's desired state
      description: |
        Atlas withdrawing its assertion — the mirror image of the PUT, and the
        half of §16.0 a source Boat needs once a migration has repointed a VM
        away from it. Without it a host keeps `{epoch, Running}` for a VM it no
        longer owns forever, and its sweep starts that VM again the moment it
        observes it stopped.

        It touches nothing on the host. It is not a terminate: no unit is
        stopped and no volume is removed, and a VM running here goes on running.
        What ends is Boat's authority to act on it — the reconciler treats a VM
        with no desired record as one it was never told about (§1), so the sweep
        leaves it exactly as the host has it.

        It deliberately does NOT clear the fence epoch. The epoch answers "which
        incarnation of this UUID may boot here", and dropping it would let a
        partitioned Atlas re-assert an older one and boot a VM that has since
        moved to another host — the split-brain the fence exists to prevent
        (§11.1). A retraction removes an authority; it must not hand one back.

        Idempotent: retracting what was never asserted answers 204 as well,
        because the caller's question is "hold nothing for this UUID" and the
        answer is the same either way.
      operationId: deleteVirtualMachine
      responses:
        "204":
          description: This host holds no desired state for the VM
        "401":
          $ref: "#/components/responses/Unauthorized"

  /export:
    get:
      summary: This host's entire observed state, in one document
      description: |
        Boat re-asserting fact, the mirror image of Atlas re-asserting intent
        with PUT. Those two calls run back to back fully resynchronize a host
        from any state, which is why this supersedes a periodic polling sweep.

        It is a consistent snapshot: materialized inside one short read
        transaction and released before it is written out, never held under
        the write lock, so a busy host is never mistaken for a partitioned one.

        The observed epoch it carries is what a later CAS write is matched
        against, so a caller can act on exactly the snapshot it read.
      operationId: getExport
      responses:
        "200":
          description: The whole-host document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /watch:
    get:
      summary: Stream observed changes as they happen
      description: |
        Server-sent events, for latency rather than truth: a dropped stream
        costs freshness, and the export restores it. Each event carries the
        observed epoch it was emitted at, so a client that reconnects knows
        whether it missed anything.
      operationId: watch
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vms/{uuid}/start:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Start a provisioned VM
      description: |
        Idempotent: starting a running VM is a no-op, and re-posting a completed
        `op_id` returns the first result without re-running (§2.7).

        A VM that stopped with a complete memory snapshot resumes from it; the
        host decides that from the on-disk marker, not from the request.
      operationId: startVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Either the `op_id` names different work, or this host holds no
            usable fence for the VM. The two need opposite responses from the
            caller — a colliding identifier must not be retried, while an
            unfenced start becomes possible the moment Atlas PUTs the epoch —
            so `reason` distinguishes them rather than leaving the caller to
            parse a sentence.

            An unfenced start does not consume the operation identifier, so the
            retry after the PUT may reuse it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vms/{uuid}/stop:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Stop a running VM
      description: |
        Cooperative by default: the guest is asked to power itself off through
        the Firecracker API so its kernel syncs filesystems before the unit is
        stopped. Networking teardown is fired by the unit's ExecStopPost either
        way.
      operationId: stopVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/pause:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Pause a running guest
      description: |
        Freezes the guest through the Firecracker API. The unit stays active, so a paused VM is still holding its RAM — this frees CPU, not memory.
      operationId: PauseVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/resume:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Resume a paused guest
      description: |
        The inverse of pause. A guest that was not paused is already where this asks it to be.

        Refused while this host holds `desired_power = Stopped` for the VM: an
        operator's stop is the kind of stop that stays, and unfreezing the vCPUs
        of a VM that was told to be down would undo it (§11.3).
      operationId: ResumeVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Either the `op_id` names different work, or this host holds
            `desired_power = Stopped` for the VM. The second becomes possible
            the moment Atlas asserts `desired_power = Running`, and does not
            consume the operation identifier, so the retry after the PUT may
            reuse it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vms/{uuid}/sleep:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Park a VM to free its RAM
      description: |
        Stops the guest after capturing a memory snapshot, then parks its address so the first inbound TCP SYN wakes it.
        
        Refused when the wake trap is not running: a VM that sleeps with nothing watching its counter never wakes, and declining the sleep is better than stranding it.
      operationId: SleepVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/wake:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Wake a sleeping VM now
      description: |
        The operator's equivalent of the traffic that would have woken it. Removes the sleeping marker and starts the unit, which resumes from the memory snapshot.

        Waking is booting, so it is gated exactly as a start is: by the fence,
        and by `desired_power`. An explicit wake does not outrank an explicit
        stop (§11.3) — otherwise the operator who stopped a VM would have no way
        to make it stay down.
      operationId: WakeVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The `op_id` names different work, or this host holds no usable fence
            for the VM, or it holds `desired_power = Stopped` for it. Only the
            first is a caller bug; the other two become possible once Atlas PUTs
            the epoch or the power, and neither consumes the operation
            identifier, so the retry after the PUT may reuse it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vms/{uuid}/rebuild:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Rebuild a VM's root disk from an image or a snapshot
      description: |
        Destroys the guest's root filesystem and lays it down again from the
        source named here, keeping the VM's identity, addresses and data disk.

        This is the one verb whose request carries more than desired state can
        supply. The source is a choice made at the moment of asking, not a
        standing intent, and the guest identity is what the fresh filesystem
        must be told about itself — neither is anywhere in
        `DesiredVirtualMachine`. What IS desired state is read from there and
        not re-sent: the root and data disk sizes the new filesystem is grown
        to. The per-VM uid is neither, and is read off the host's own
        `network.env` for the VM.
      operationId: RebuildVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebuildRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/terminate:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Destroy a VM and everything it holds on this host
      description: |
        Removes the unit, the disks, the network and the whole VM tree. Idempotent: terminating what is already gone succeeds, because a retry after a partial failure must be able to finish the job.
      operationId: TerminateVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/resize:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Resize a stopped VM
      description: |
        Applies the desired vCPU, memory and disk numbers. A disk only ever
        grows: shrinking a filesystem that has already written past the new
        boundary destroys data, so it is refused rather than attempted.

        It carries none of the numbers. They are desired state, so they arrive
        by PUT and this asks only for them to be applied now — which is what
        makes a retry safe and what stops the request and the store from ever
        stating two different shapes for one VM. The jailer's cgroup caps are
        derived here from the same numbers, because the guest's RAM and the
        host's `memory.max` are independent ceilings and a resize that moved
        only the first would have the kernel OOM-kill Firecracker on the next
        boot.
      operationId: resizeVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          description: |
            This host holds no desired state for the VM, or the desired state it
            holds states no vCPU or memory. There is nothing to apply, and
            applying the zero would write a machine config no guest can boot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/reserved-ip:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
    post:
      summary: Attach or detach a Reserved IP's host-side 1:1 NAT
      description: |
        DNATs an inbound public IPv4 to this VM's guest and SNATs the guest's
        egress back out as it, applied live with no reboot and recorded in the
        VM's `network.env` so a cold boot re-creates the same NAT from disk.
        Detach removes both, keyed on the guest's own address. Idempotent.

        The delivery model — a DigitalOcean anchor or a routed flexible IP — is
        discovered on the host, not sent: which one applies is a host-local fact
        (spec/33-boat.md §6.1), and the guest's private address and veth are read
        from the sidecar rather than taken from the caller, so the NAT can never
        be built around the wrong VM.
      operationId: ReservedIpVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservedIpRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          description: |
            The action is not attach|detach, or it is attach and the reserved
            IPv4 is missing or not an address — rendering a value that is not an
            address into an nft rule is what the boundary check refuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/migrate/{phase}:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
      - name: phase
        in: path
        required: true
        description: |
          Which mutating phase of the cross-host migration saga to run on this
          host. Atlas is the saga orchestrator and drives the phases one RPC at a
          time in a star (the two hosts never talk on the control plane); this
          host runs the named phase as a stateless, idempotent step and reports
          its typed result. One of: export-source, export-base, clone-target,
          receive-base, inject-identity, collapse-clone, forward-up,
          source-forward, target-receive, forward-down, withdraw-private,
          source-autostart, cleanup-source. The poll-only Hydrating phase is GET
          .../migrate/hydration instead, because it runs every controller tick
          and must not journal a record per tick.
        schema:
          type: string
    post:
      summary: Run one mutating phase of a cross-host migration saga
      description: |
        Each phase is a stateless idempotent host operation keyed off host
        artifacts (dmsetup info, qemu-nbd pidfiles, /sys/block/nbdN/pid), never
        off stored state, so a lost-task re-entry re-derives the same devices
        from the UUID alone and converges. It runs through the same claim →
        per-UUID turn → terminal-record machinery as every other verb, so a
        retried Atlas Task returns its first result rather than re-running the
        phase, and two phases for one VM never overlap.

        Unlike the lifecycle verbs it does NOT require the VM to already exist on
        this host: a target-side phase (clone-target, inject-identity) builds the
        VM's disk before any cutover, and a source-side phase (cleanup-source)
        runs as the VM is being retired. The phase's typed result rides on the
        operation record's `result`, the same field `sleep-vm` uses.
      operationId: MigrateVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          description: |
            The phase is not one this host runs, or its required parameters are
            missing — an export with no bind address, a forward-up with no role.
            Refused at the boundary before an operation is claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /vms/{uuid}/migrate/hydration:
    parameters:
      - $ref: "#/components/parameters/VirtualMachineUuid"
      - name: clone_device
        in: query
        required: false
        description: |
          Poll this single dm device instead of the VM's own disk clones. Empty
          (the usual case) polls the root clone plus the data clone when it
          exists and reports the MIN. Set to a base-image ship's clone
          (atlas-base-<image>-clone) it reuses this same percent for the
          local-base ship.
        schema:
          type: string
    get:
      summary: Poll a migrating VM's hydration percent
      description: |
        The Hydrating phase, called once per controller tick. Deliberately a GET
        with no operation identifier and no journal record: `perform` writes one
        terminal record per operation_id, and a per-tick poll would either need a
        fresh id every tick or bury the journal — so this is a plain read path,
        the same shape as GET /export. It still enables hydration on first touch
        (an idempotent dmsetup message) and reads the current percent, but writes
        nothing down and takes no per-UUID turn.

        A missing clone reads as 100% — it was never built or already collapsed,
        so a re-entry after cutover advances cleanly. A dead source is reported
        `source_healthy: false` rather than as a percent, because the percent is
        meaningless on a dead source and the controller must re-run the
        clone-target phase to rebuild the stack.
      operationId: GetMigrationHydration
      responses:
        "200":
          description: The current hydration reading for this migrating VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationHydration"
        "400":
          description: The uuid is not a virtual machine UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: The hydration state could not be read from the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /host-verbs/{verb}:
    parameters:
      - name: verb
        in: path
        required: true
        description: |
          A host operation Atlas used to drive over SSH as `boat <verb>` —
          snapshot-vm, provision-vm, sync-image, firewall-apply and the rest of
          the host-verb set (§2.4). The daemon runs the named verb in-process,
          through the same claim → turn → terminal-record machinery as every
          lifecycle verb, so it is auditable, replayable and recoverable rather
          than a second path into the host the API cannot see (§2.1). The set is
          closed and compiled in; a verb outside it is refused before a claim.
        schema:
          type: string
    post:
      summary: Run one host operation Atlas used to drive over SSH
      description: |
        The transport for the host verbs — the operations that create disks,
        take snapshots, sync images and apply per-VM networking. Each was a
        `boat <verb>` invoked over an SSH connection; each is now a journaled
        operation with an `op_id`, so a retried Atlas Task returns its first
        result rather than running the verb twice (§2.7).

        Like a migration phase and unlike a lifecycle verb it does NOT require
        the VM to already exist: `provision-vm` creates it. A VM-scoped verb
        (one that names a VIRTUAL_MACHINE_NAME) takes that VM's turn, so it can
        never overlap a reconcile pass on the same machine; a host-scoped verb
        (`sync-image`, `reset-server`) takes one host-wide turn instead. The
        verb's typed result rides on the operation record's `result`, the same
        field the lifecycle verbs use.
      operationId: RunHostVerb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostVerbRequest"
      responses:
        "200":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          description: |
            The verb is not one this host serves, or a VM-scoped verb named a
            malformed UUID. Refused at the boundary before an operation is
            claimed, so the identifier is free to reuse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OperationIdentifierConflict"

  /ops/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        description: The Atlas Task name this operation was created under.
        schema:
          type: string
    get:
      summary: One operation's journal record
      description: |
        Crash-recovery truth. Atlas's operator-facing audit record is still the
        Task row; the two share this identifier (§2.7).
      operationId: getOperation
      responses:
        "200":
          description: The operation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /quiesce:
    post:
      summary: Pause admission of new operations for a self-update
      description: |
        §5 step 3, driven by the out-of-cgroup updater over the local socket.
        Raise the admission gate so this daemon refuses to CLAIM new operations,
        wait (bounded) for the operations already in flight to reach their journal
        checkpoint, and record a checkpoint of its own — so an update interrupted
        mid-restart is replayable rather than lost. Idempotent: quiescing an
        already-quiesced daemon returns once in-flight work has drained.

        It is called by the updater, never by Atlas: only a process OUTSIDE
        boat.service's cgroup can quiesce the serving daemon and then survive the
        restart that swaps its binary. While quiesced, the mutating verbs answer
        409 with reason `service-quiescing` — a retryable refusal, no claim and no
        journal record — so their callers re-try once the new binary serves;
        reads (/export, /health, /ops) keep answering throughout.
      operationId: quiesce
      responses:
        "200":
          description: The daemon is quiesced and in-flight work has drained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuiesceState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            In-flight work did not drain within the bounded grace, or the
            checkpoint could not be recorded. The gate is lowered again on this
            path, so a failed quiesce leaves the daemon serving rather than half-
            paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /resume:
    post:
      summary: Resume admission of new operations after an aborted update
      description: |
        Lower the admission gate /quiesce raised, so the daemon claims new
        operations again. It is the ABORT path only: once the update has restarted
        the daemon a fresh process is serving and there is nothing to resume, so
        this is called just when the updater gives up BEFORE the swap. Idempotent.
      operationId: resume
      responses:
        "200":
          description: The daemon is serving again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuiesceState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /update:
    post:
      summary: Stage a signed release and launch a detached self-update
      description: |
        Atlas pushes a signed release here (§5). The daemon VERIFIES it FIRST — the
        ed25519 signature over the (version, checksum) manifest and the checksum
        over the bytes — and refuses a release that does not verify with 400 before
        anything touches the disk. On success it writes the binary and its manifest
        to a staging directory under the daemon's StateDirectory and spawns a
        DETACHED updater OUTSIDE boat.service's cgroup (systemd-run --scope), then
        answers 202 at once: the update proceeds asynchronously and Atlas observes
        the new version through /export.

        The cgroup handoff is load-bearing. The updater restarts boat.service,
        which SIGTERMs boat.service's whole cgroup; an updater running inside it
        would be killed mid-restart and could never health-check or roll back. So
        the daemon only STARTS the update here — it never runs it.
      operationId: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
      responses:
        "202":
          description: The release verified and a detached updater was launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccepted"
        "400":
          description: |
            The release did not verify — a bad signature, a wrong checksum, or a
            malformed manifest. Nothing was staged and no updater was launched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: |
            This host has no trusted update key configured, so it accepts no
            self-update. Configure --update-key-file and restart the daemon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A short-lived per-host token minted by Atlas. Requests arriving over
        /run/boat/boat.sock are authenticated by unix peer credentials instead — the
        socket is 0660 and group-owned by the boat service user.

  parameters:
    VirtualMachineUuid:
      name: uuid
      in: path
      required: true
      description: The VM's UUID — the same name the Atlas Virtual Machine row carries.
      schema:
        type: string

    UnitName:
      name: name
      in: path
      required: true
      description: |
        A systemd unit name, spelled in full with its `.service` suffix. It must
        be one of the units this Boat supervises; the set is closed and
        compiled in, and no per-VM `firecracker-vm@` instance is in it.
      schema:
        type: string

    ObservedEpochPrecondition:
      name: If-Match
      in: header
      required: false
      description: |
        The compare-and-set precondition of §11.2, and the whole of what makes
        the mirror safe to decide from. Its value is an `observed_epoch` read
        out of a `GET /export`, optionally wrapped in the quotes an HTTP entity
        tag carries (`42` and `"42"` are the same precondition).

        The token is whole-host and the COMPARISON is per-resource: Boat refuses
        the write if the record for the VM this request names has been written
        since that epoch, not if anything at all on the host has. The difference
        decides whether the mechanism is usable — a host running forty VMs bumps
        its epoch on every one of their observations, so a whole-host comparison
        against a mirror refreshed every five minutes would refuse every write,
        and a precondition that always fails is a precondition somebody turns
        off. It also refuses an epoch NEWER than any this host has issued, which
        is the caller quoting a snapshot of a different store — a Boat whose
        bbolt file was lost and restarted from zero.

        Omit it when re-asserting intent already known, which is what Atlas does
        before every verb: there is no decision to protect, and a precondition
        on a re-assert would make reconnect fail exactly when it matters.
      schema:
        type: string

  responses:
    OperationAccepted:
      description: |
        The operation record. Returned for a fresh run, for a still-running
        operation, and for a replay of a completed `op_id` alike.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such VM or operation on this host
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OperationIdentifierConflict:
      description: |
        The `op_id` is already recorded against a different verb or VM. Replay is
        only replay when it is the same operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, boat_version]
      properties:
        status:
          type: string
          enum: [ok]
        boat_version:
          type: string
          description: The version of the running binary — every unit on this host is this build.

    Host:
      type: object
      required: [hostname, boat_version, started_at, virtual_machine_count, units]
      properties:
        hostname:
          type: string
        boat_version:
          type: string
        started_at:
          type: string
          format: date-time
          description: When this daemon process started. A restart is visible here.
        virtual_machine_count:
          type: integer
          description: How many VMs this host currently observes.
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitLiveness"
          description: |
            The sibling units this Boat supervises, and what systemd says about
            each. Required, and an empty array is an answer rather than a
            silence: it means this host was asked and runs none of them.

            Only the units this host actually HAS appear. A supervised unit
            systemd reports as `not-found` is not a unit that is down, it is a
            service this host does not run, and listing it would flag every host
            in the fleet as permanently degraded — which is how a health field
            stops being read.

    VirtualMachineStatus:
      type: string
      description: |
        Boat's observed status, derived from the host — the unit's state and the
        on-disk markers — never from a command's success.
      enum: [Running, Stopped, Paused, Sleeping, Failed, Unknown]

    VirtualMachine:
      type: object
      required: [uuid, observed_status, observed_at]
      properties:
        uuid:
          type: string
        observed_status:
          $ref: "#/components/schemas/VirtualMachineStatus"
        observed_at:
          type: string
          format: date-time
        unit_active_state:
          type: string
          description: The systemd ActiveState of firecracker-vm@<uuid>.service, verbatim.
        unit_sub_state:
          type: string
          description: The systemd SubState of the unit, verbatim.
        has_memory_snapshot:
          type: boolean
          description: A complete memory snapshot is staged, so the next start resumes from RAM.
        sleeping:
          type: boolean
          description: The sleeping marker is present — the VM is parked, not stopped.
        firecracker_pid:
          type: integer
          description: |
            The process that answered on this VM's API socket. A diagnostic that
            lets an operator strace the right process, and nothing more: the
            liveness claim is that the socket answered, so an absent pid — no
            live Firecracker, or one whose socket holder `ss` could not name —
            says nothing on its own about observed_status.

        # Deliberately absent. Each of these was declared here and set by no
        # handler, so a client written against this document read it as absent
        # forever; a field the server never sends is worse than one this schema
        # does not promise.
        #
        # - boot_epoch. The fence is not an observation. This document is what
        #   the host was seen to be, while the epoch is what Boat was told and
        #   remembers — and the export already carries every fence this host
        #   holds under `fence_epochs`, keyed by the same UUID. A third copy,
        #   beside the `DesiredVirtualMachine.boot_epoch` Atlas asserted, is a
        #   third place for one number to disagree with itself.
        #
        # - quarantined, quarantine_reason. A quarantined artifact set is not a
        #   VM and never becomes one: the scan keeps the two sets disjoint by
        #   construction (spec/33-boat.md §3.4), so this flag could not have been
        #   true on a document that exists. The export's top-level `quarantine`
        #   array is the report, and it carries the evidence as well as the
        #   reason.
        #
        # - observed_vcpus, observed_memory_megabytes, observed_disk_gigabytes,
        #   observed_data_disk_gigabytes. The shape of a drift check against what
        #   Atlas asked for, and nothing measures them: the numbers are in the
        #   VM's firecracker.json and in its logical volumes, which is a
        #   subprocess per VM per sweep and a widened sudoers grant. They come
        #   back in the commit that reads them.

    DesiredPower:
      type: string
      description: |
        The only power input Boat's reconciler takes. An explicit Stopped
        outranks a wake trap: a VM that was told to stop is not woken by
        traffic.
      enum: [Running, Stopped]

    DesiredVirtualMachine:
      type: object
      required: [uuid, boot_epoch, desired_power]
      properties:
        uuid:
          type: string
        boot_epoch:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic per-VM fence, issued only by Atlas and bumped at exactly
            one point: a migration's repoint. Boat refuses to boot a UUID whose
            local epoch is older than the one on disk, which is what stops two
            live copies of one VM after a partition.

            Epochs start at 1. Boat gates on whether it holds a fence at all, so
            a zero would be a held fence rather than the absence of one — do not
            use 0 to mean unfenced.
        desired_power:
          $ref: "#/components/schemas/DesiredPower"
        server:
          type: string
          description: |
            The host Atlas has placed this VM on — its Frappe Server name. The
            §11.1 "server == self" discriminator: a host boots a VM only when the
            desired record names THIS host, so a VM assigned elsewhere is refused
            even at a valid epoch. Absent means Atlas asserted no placement, and the
            boot gate falls back to the epoch alone.
        vcpus:
          type: integer
        cpu_max_cores:
          type: number
          description: |
            A number, not an integer: a share of a core is a real product. Atlas
            sells fractional CPU (a Shared 1x VM gets a quarter of a core), its
            own field is a float, and Python's JSON encoder always writes a
            float with a decimal point — which Go refuses to decode into an
            integer, even for 1.0. Typed as an integer, this rejected every
            desired-state assertion Atlas could send, for every VM.
        cpu_mode:
          type: string
        memory_megabytes:
          type: integer
        disk_gigabytes:
          type: integer
        data_disk_gigabytes:
          type: integer
        sleep_on_idle:
          type: boolean
          description: |
            Enrolment, not policy. Boat runs the sleep reflex; whether a VM is
            enrolled in it is Atlas's decision and arrives here.
        idle_timeout_seconds:
          type: integer
        ipv6_address:
          type: string
        private_address:
          type: string
        mac_address:
          type: string
        tap_device:
          type: string

    Quarantine:
      type: object
      required: [identifier, reason]
      properties:
        identifier:
          type: string
          description: |
            Whatever the host retained to name this artifact set — usually a VM
            UUID, but a stranded namespace or address keeps only its own name,
            and inventing a UUID for it would be a guess.
        reason:
          type: string
          description: What was incoherent, in one sentence.
        evidence:
          type: array
          items:
            type: string
          description: The observations that made it ambiguous rather than simply absent.
        seen_at:
          type: string
          format: date-time

    UnitLiveness:
      type: object
      required: [name, active_state, sub_state]
      properties:
        name:
          type: string
        active_state:
          type: string
          description: systemd's ActiveState for the unit, verbatim. `active` is up.
        sub_state:
          type: string
          description: |
            systemd's SubState, verbatim, and the field that carries what
            ActiveState flattens away — a oneshot that ran and left is
            `active`/`exited`, a daemon that is up is `active`/`running`, and a
            unit systemd is waiting to retry is `activating`/`auto-restart`.

    UnitAction:
      type: string
      description: |
        What Boat may ask of a sibling unit. Both converge it upward, and there
        is no `stop`: see the operation's description for why the verb with
        teeth is the one that is missing.
      enum: [start, restart]

    UnitActionRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/UnitAction"

    LogicalVolume:
      type: object
      required: [name]
      properties:
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
        pool:
          type: string
        origin:
          type: string
          description: Set when this volume is a snapshot or a clone of another.

    HostFacts:
      type: object
      required: [hostname, boat_version]
      properties:
        hostname:
          type: string
        boat_version:
          type: string
        kernel_version:
          type: string
        firecracker_version:
          type: string
        vcpus_total:
          type: integer
        memory_megabytes_total:
          type: integer
        memory_megabytes_free:
          type: integer
        pool_disk_gigabytes_total:
          type: integer
        pool_used_percent:
          type: number
        host_signature:
          type: string
          description: |
            Identifies the CPU, kernel and Firecracker a memory snapshot was
            captured on. A snapshot only restores on a matching host.

    Export:
      type: object
      required: [observed_epoch, taken_at, host, virtual_machines]
      properties:
        observed_epoch:
          type: integer
          format: int64
          description: |
            Monotonic, bumped on every observed change. A CAS write is matched
            against this, so a caller acts on exactly the snapshot it read.
        taken_at:
          type: string
          format: date-time
          description: Always UTC, with a trailing Z. A naive stamp cannot be ordered across hosts.
        host:
          $ref: "#/components/schemas/HostFacts"
        virtual_machines:
          type: array
          items:
            $ref: "#/components/schemas/VirtualMachine"
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitLiveness"
          description: The sibling units this Boat supervises, and whether they are up.
        logical_volumes:
          type: array
          items:
            $ref: "#/components/schemas/LogicalVolume"
        fence_epochs:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Every fence this host holds, by UUID.
        quarantine:
          type: array
          items:
            $ref: "#/components/schemas/Quarantine"
          description: |
            Artifact sets this host holds that could not be read as a coherent
            VM. Reported so an operator can resolve them; never acted upon, and
            never counted as a VM.

    OperationStatus:
      type: string
      enum: [Running, Success, Failure]

    Operation:
      type: object
      required: [operation_id, verb, uuid, status, started_at]
      properties:
        operation_id:
          type: string
          description: Equal to the Atlas Task name that drove this operation.
        verb:
          type: string
          description: The verb that ran, in the host CLI's grammar (start-vm, stop-vm).
        uuid:
          type: string
        status:
          $ref: "#/components/schemas/OperationStatus"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        exit_code:
          type: integer
          description: |
            0 on success. Mirrors the exit code the equivalent Task carried.

            Absent means the operation has not finished — an operation still
            Running has no exit code, and reporting 0 for one would tell a
            client it succeeded. Any terminal operation carries this field.
        output:
          type: string
          description: |
            The operation's combined trace and output — the same text a Task row's
            stdout carries today, so the operator surface is unchanged.
        error:
          type: string
          description: Set when status is Failure. The failure, stated once.
        result:
          type: object
          additionalProperties: true
          description: |
            The verb's typed result: the same payload the SSH script's one
            `ATLAS_RESULT=` line carries, so a Task reads the same either way.
            Atlas folds it back onto the Task's stdout as that line
            (`boat_client.OPERATION_RESULT_FIELD`).

            `output` is the trace an operator reads; this is the handful of
            values a CALLER acts on. `sleep-vm` is the one verb with any today —
            `memory_snapshot`, plus `reason` when the snapshot was skipped and
            `memory_snapshot_bytes` when one was taken — and without it Atlas
            cannot learn whether a slept VM resumes from RAM or cold-boots, which
            is decided on the host and stated nowhere else.

            **Absent is not false.** A verb with no result omits the field, and
            so does one that failed, so a caller reading a value out of it is
            reading something the host actually reported.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in one sentence, at the boundary where it was detected.
        reason:
          type: string
          description: |
            A stable token for the cases a caller must tell apart by code rather
            than by prose. Absent when the sentence is the whole answer.

            `fence-regression` and `stale-observation` are the two 409s a PUT
            can return, and they call for opposite behaviour: one must not be
            retried, the other must be retried against a fresh export.

            `service-quiescing` is the 409 a mutating verb returns while the
            daemon is paused for a self-update (POST /quiesce). It MUST be
            retried, unchanged, once the new binary serves — no claim was made
            and no journal record was written, so the retry is the first real
            attempt, not a replay.
          enum:
            - operation-identifier-conflict
            - no-fence
            - stale-fence
            - fence-regression
            - stale-observation
            - service-quiescing

    ReservedIpRequest:
      type: object
      required: [operation_id, action]
      properties:
        operation_id:
          type: string
          description: The Atlas Task name. Re-posting one returns its recorded result.
        action:
          type: string
          enum: [attach, detach]
          description: |
            attach installs the 1:1 NAT and writes the durable flag; detach
            removes both, keyed on the guest's own address.
        reserved_ipv4:
          type: string
          description: |
            The public IPv4 to 1:1-NAT to this VM's guest. Required for attach;
            ignored for detach, which keys on the guest's private address, so a
            detach need not re-state the address being taken away.

    MigrateRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
          description: |
            The Atlas Task name. Re-posting one returns the phase's first result
            rather than running it again — the idempotent-replay key every verb
            shares. Each migration phase is ALSO idempotent against the host, so a
            replay whose first record was lost re-derives the same devices and
            converges rather than duplicating them.
        bind_address:
          type: string
          description: |
            export-source, export-base: the source's own public IPv4 that
            qemu-nbd binds, dialed directly by the target's nbd client over plain
            TCP (stage 1, no tunnel). The one thing the source cannot derive from
            the UUID.
        image_name:
          type: string
          description: |
            export-base, clone-target, receive-base: the base image being shipped
            or cloned from — the kernel comes from it at cutover. A LOCAL image
            (no rootfs URL) is the only kind shipped over NBD; a syncable image
            uses Sync to Server instead.
        disk_gb:
          type: integer
          description: |
            clone-target, receive-base: the size of the destination thin LV the
            clone hydrates into, which must be >= the source blockdev — a smaller
            dest makes dm-clone fail with "Invalid argument".
        data_disk_gb:
          type: integer
          description: |
            clone-target: the data disk size, 0 for a VM with no data disk.
            collapse-clone: whether a second (data) clone must be collapsed too.
        source_host:
          type: string
          description: |
            clone-target, receive-base: the source's reachable address the nbd
            client dials. forward-up (target role only): the address the socat
            connector dials.
        base_phase:
          type: string
          enum: [prepare, finalize]
          description: |
            receive-base only: which half of the two-step base ship runs this
            tick — prepare lays down the nbd client, thin LV, dm-clone and image
            directory; finalize collapses the fully-hydrated clone to a read-only
            base LV. PollHydration runs between them.
        role:
          type: string
          enum: [source, target]
          description: |
            forward-up, forward-down: which end of the keep-address forward
            tunnel this host is — the source (TCP listener) or the target
            (connector).
        virtual_machine_ipv6:
          type: string
          description: |
            forward-up, source-forward, target-receive, forward-down: the VM's
            /128 whose delivery is forwarded onto (or off) the tunnel. Optional on
            forward-up, which runs once with a bare tunnel before the routes are
            known and again at cutover once they are.
        private_address:
          type: string
          description: |
            withdraw-private only: the VM's private-plane /128 to withdraw from
            THIS (source) host's local-ownership cache, so its ANCP daemon stops
            advertising the address before the target boots the guest and
            advertises the same /128. Empty is a clean no-op for a tenant-less VM.
        nbd_pid:
          type: integer
          description: |
            cleanup-source only: the qemu-nbd pid export-source recorded, killed
            first, with the port's pidfile as the fallback. The port itself is
            derived from the UUID.
        keep_address:
          type: boolean
          description: |
            cleanup-source only: on a keep-address (permanent-forward) migration
            the source keeps forwarding the VM's /128 to the target — the mig6
            tunnel, its route, the nft forward and the proxy-NDP re-assert carry
            live tenant ingress until the block drains (spec/24 §2.9.4). True
            SUPPRESSES the vm-network-down teardown so that forward path stays up;
            the disk, nbd and snapshot teardown still run. False (a change-address
            migration) brings the source network down, the same teardown terminate
            does.
        enabled:
          type: boolean
          description: |
            source-autostart only: whether the source VM's systemd unit stays in
            multi-user.target across a host reboot. Pending sends false (the
            default), which takes the unit out of multi-user.target.wants so a
            source-host reboot mid-migration cannot cold-boot a second copy of the
            guest — the unit's WantedBy=multi-user.target plus provision's
            `systemctl enable` would otherwise auto-start it, bypassing the
            migration fence, since its ExecStart is jailer-launch.sh and not `boat
            vm start`. True is the inverse an operator runs to hand an abandoned
            source copy back its reboot survival. Idempotent either way: enabling
            an enabled unit and disabling a disabled one are both no-ops.
        identity:
          $ref: "#/components/schemas/GuestIdentity"

    MigrationHydration:
      type: object
      required: [hydration_percent, source_healthy]
      properties:
        hydration_percent:
          type: integer
          description: |
            0..100, the MIN across the VM's disk clones — the phase advances only
            when every disk is fully local. 100 means every block is on this host
            (or the clone is already gone), and only then may collapse-clone run.
            Meaningless, and reported 0, when source_healthy is false.
        source_healthy:
          type: boolean
          description: |
            Whether the source nbd client backing the clone is still alive. False
            means the source died and hydration is frozen; the controller must
            re-run the clone-target phase, which rebuilds the stack and
            re-hydrates from 0. The one three-valued host check in a migration —
            an unreadable liveness surfaces as a 500 rather than rounding to
            "dead" and triggering a destructive rebuild.

    OperationRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
          description: |
            The Atlas Task name. Re-posting one returns its recorded result
            rather than running the verb again.

    HostVerbRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
          description: The Atlas Task name. Re-posting one returns its recorded result.
        variables:
          type: object
          additionalProperties: true
          description: |
            The verb's inputs, as the SAME UPPER_SNAKE variables dict the SSH
            runner rendered to `--kebab-case` flags. A value is a string, or an
            array of strings for a repeatable flag (`CGROUP_ARG`,
            `PUBLIC_ALLOW_PORT`). The daemon renders them to the verb's flag argv
            — the one place the host CLI grammar still appears — so a verb's
            inputs are stated once and mean the same thing whichever transport
            carried them, exactly as the lifecycle verbs kept their variable
            names across the port.

    StartRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
          description: The Atlas Task name. Re-posting one returns its recorded result.

    RebuildRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
          description: The Atlas Task name. Re-posting one returns its recorded result.
        image:
          type: string
          description: |
            A base image already synced to this host, whose pristine rootfs the
            new root filesystem is a copy-on-write snapshot of.
        snapshot_device:
          type: string
          description: |
            The device path of a snapshot volume on this host to restore from,
            instead of an image. Exactly one source is needed; this one wins
            when both are given.
        data_snapshot_device:
          type: string
          description: |
            The data disk's own snapshot, restored the way the root disk is.
            Absent leaves the live data disk exactly as it is — a rebuild from
            an image always does, because there is no image source for a data
            disk, and wiping a tenant's home directory because they asked to
            reinstall the operating system is not a default.
        identity:
          $ref: "#/components/schemas/GuestIdentity"

    GuestIdentity:
      type: object
      description: |
        What makes a freshly laid-down root filesystem this VM's rather than the
        image's. Boat writes every field of it into the mounted filesystem
        without interpreting any of it: an address is bytes it puts in a file,
        an authorized-keys blob is a blob, and `extra_env` is a list of paths
        and contents Boat cannot tell apart from one another.

        Hostname and machine-id are deliberately absent. Boat derives both from
        the UUID by a fixed rule it owns, because naming a host after its UUID
        is mechanics rather than identity, and a value sent for them could
        disagree with the one the host already uses.
      properties:
        ipv6_address:
          type: string
        ipv4_guest_cidr:
          type: string
          description: |
            The guest's end of the NAT44 /30 it egresses through. The host's end
            is not here: a rebuild does not touch host-side networking, so the
            value would be accepted and ignored.
        ipv4_gateway:
          type: string
        private_address:
          type: string
          description: |
            The VM's /128 on the host mesh, empty for a VM off the private
            plane. The line is written either way, so the guest's network unit
            has a defined value to test rather than a missing variable.
        authorized_keys_blob:
          type: string
          description: |
            The guest's root authorized_keys file, whole and verbatim. One key
            or six, and whose they are, is not legible from here and is not
            Boat's business.
        data_disk_mount_at:
          type: string
          description: |
            Where the data disk is mounted in the guest, so the fresh rootfs
            regains its fstab line. Empty means no data mount and no line.
        extra_env:
          type: array
          items:
            $ref: "#/components/schemas/GuestFile"
          description: |
            Every other file the control plane wants in the fresh rootfs. This
            is the guest-service seam: a field named for what a file MEANS would
            put a service semantic into Boat's vocabulary and make the host care
            what runs inside the guest, so the files arrive anonymous.

    GuestFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: |
            An absolute path inside the guest. It is joined onto the host's
            mount point, so a relative path or one containing `..` is refused
            rather than sanitised — it would write on the host, as root.
        content:
          type: string
          description: The file's bytes, written as they arrived.

    StopRequest:
      type: object
      required: [operation_id]
      properties:
        operation_id:
          type: string
        graceful:
          type: boolean
          default: true
          description: |
            Ask the guest to power itself off first, so anything dirty in its page
            cache is written. False discards guest RAM — for callers that capture
            the disk another way, such as a migration cold stop.
        stop_timeout_seconds:
          type: integer
          default: 0
          description: |
            Bound the graceful drain without skipping the unit's ExecStopPost.
            0 leaves systemd's default drain in place.

    QuiesceState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [quiesced, serving]
          description: quiesced after /quiesce, serving after /resume.

    UpdateRequest:
      type: object
      required: [version, sha256, signature, binary]
      properties:
        version:
          type: string
          description: |
            The git-describe version this release claims to be, bound into the
            signed manifest. `different from running` is the whole update test —
            versions are not ordered, so a downgrade is as valid as an upgrade.
        sha256:
          type: string
          description: |
            Lowercase hex SHA-256 of the binary, bound into the signed manifest.
            The signature authenticates this claim; the checksum authenticates the
            bytes; an update proceeds on neither alone.
        signature:
          type: string
          format: byte
          description: |
            The ed25519 signature over the canonical (version, checksum) manifest,
            base64-encoded. The daemon verifies it against its configured trusted
            key before anything touches the disk.
        binary:
          type: string
          format: byte
          description: The release binary itself, base64-encoded.

    UpdateAccepted:
      type: object
      required: [update_id, version]
      properties:
        update_id:
          type: string
          description: |
            The staging identifier this update runs under. The detached updater's
            transient scope unit is boat-update-<update_id> and its staged release
            lives at <StateDirectory>/update/<update_id>.
        version:
          type: string
          description: The version being applied, echoed back so the caller can watch /export for it.
